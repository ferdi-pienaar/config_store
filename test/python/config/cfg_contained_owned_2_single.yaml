
descriptor:
    name: device
    persistent: true
    aggregate:
    -   count: 1
        type: contained
        descriptor:
            name: network
            persistent: true
            aggregate:
            -   count: 1
                type: owned
                descriptor:
                    name: ipaddr
                    persistent: true
                    set: cfg_mgr::cm_set_int
                    setdef: cfg_mgr::cm_setdef_null
                    print: cfg_mgr::cm_prt_int
                    type: unsigned long
            -   count: 1
                type: owned
                descriptor:
                    name: port
                    persistent: true
                    set: cfg_mgr::cm_set_int
                    setdef: cfg_mgr::cm_setdef_null
                    print: cfg_mgr::cm_prt_int
                    type: unsigned long
