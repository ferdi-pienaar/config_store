
descriptor:
    name: device
    persistent: true
    aggregate:
    -   count: 1
        type: contained
        descriptor:
            name: userCnt
            persistent: false
            print: cfg_mgr::cm_prt_int
            type: unsigned long
    -   count: 2
        type: owned
        counter: userCnt
        key: key_2_instances
        descriptor:
            name: user
            persistent: true
            aggregate:
            -   count: 1
                type: contained
                descriptor:
                    name: uname
                    persistent: true
                    set: cfg_mgr::cm_set_str
                    setdef: cfg_mgr::cm_setdef_null
                    print: cfg_mgr::cm_prt_str
                    array:
                        count:
                            name: UNAME_LEN
                            type: constexpr unsigned
                            value: 16
                        type: char
            -   count: 2
                type: contained
                descriptor:
                    name: key_2_instances
                    persistent: true
                    set: cfg_mgr::cm_set_int
                    setdef: cfg_mgr::cm_setdef_null
                    print: cfg_mgr::cm_prt_int
                    type: unsigned
