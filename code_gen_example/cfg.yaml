# This source file in YAML language is written by the designer of a
# configurable items hierarchy, and describes those items.  It's an input
# to the build system that makes the executable that also includes
# the config manager library.
---
constant: &nUsers
    name: MAX_NUM_USERS
    type: unsigned short
    value: 3
    
constant: &nPorts
    name: NUM_PORTS
    type: unsigned short
    value: 4

# Component item defined here to avoid too much indenting
item: &user
    name: user
    persistent: true
    aggregate:
    -   count: 1
        type: contained
        item:
            name: name
            persistent: true
            set: cfg_mgr::cm_set_str
            setdef: cfg_mgr::cm_setdef_null
            print: cfg_mgr::cm_prt_str
            type: cstring 16
    -   count: 1
        type: contained
        item:
            name: id
            persistent: true
            set: cfg_mgr::cm_set_int
            setdef: cfg_mgr::cm_setdef_null
            print: cfg_mgr::cm_prt_int
            type: unsigned long
    -   count: 1
        type: contained
        item:
            name: temp
            persistent: true
            set: set_temp           
            setdef: setdef_temp
            print: prt_temp
            type: short
    -   count: 1
        type: contained
        item:
            name: elapsed
            persistent: false
            print: cfg_mgr::cm_prt_int
            type: unsigned

# Component item defined here to avoid too much indenting
item: &home
    name: home
    persistent: true
    aggregate:
    -   count: 1
        type: owned
        item:
            name: addr
            persistent: true
            set: cfg_mgr::cm_set_int
            setdef: cfg_mgr::cm_setdef_null
            print: cfg_mgr::cm_prt_int
            type: unsigned
    -   count: 1
        type: owned
        item:
            name: location
            persistent: true
            aggregate:
            -   count: 1
                type: contained
                item:
                    name: name
                    persistent: true
                    set: cfg_mgr::cm_set_str
                    setdef: cfg_mgr::cm_setdef_null
                    print: cfg_mgr::cm_prt_str
                    type: cstring 16

# Parent item
item:
    name: device
    persistent: true
    aggregate:
    -   count: 1
        type: contained
        item:
            name: ipaddr
            persistent: true
            set: cfg_mgr::cm_set_int
            setdef: cfg_mgr::cm_setdef_null
            print: cfg_mgr::cm_prt_int
            type: unsigned long
    -   count: *nPorts
        type: contained
        item:
            name: port
            persistent: true
            set: cfg_mgr::cm_set_int
            setdef: cfg_mgr::cm_setdef_null
            print: cfg_mgr::cm_prt_int
            type: unsigned short    
    -   &userCnt_aggr
        count: 1
        type: contained
        item:
            name: userCnt
            persistent: false
            print: cfg_mgr::cm_prt_int
            type: unsigned short
    -   count: *nUsers
        type: owned
        counter: *userCnt_aggr
        item: *user
    -   count: 1
        type: contained
        item: *home
